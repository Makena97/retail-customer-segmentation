services:

  brightcart-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: brightcart-api

    ports:
      - "8000:8000"

    restart: unless-stopped


  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1

    container_name: brightcart-mlflow

    ports:
      - "5000:5000"

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"

    volumes:
      - mlflow-data:/mlflow


volumes:
  mlflow-data:
